# fly.toml app configuration file generated for xmage-llm-practice on 2026-09-15T03:18:55+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'xmage-llm-practice'
primary_region = 'iad'

[build]

# No [http_service] here on purpose: this app speaks raw JBoss-Remoting on 17171,
# not HTTP - an http_service block on the same port would have Fly's proxy try to
# terminate TLS/HTTP against a binary protocol. TCP-only service below instead.

[[services]]
  protocol = 'tcp'
  internal_port = 17171

  [[services.ports]]
    port = 17171

  [[services.tcp_checks]]
    interval = '15s'
    timeout = '10s'
    grace_period = '5m0s'

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048
