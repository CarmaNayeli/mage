# fly.toml app configuration file for the XEffigy backend (Mage.Server + Web.Gateway).
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'xeffigy'
primary_region = 'iad'

[build]

# Browsers only ever speak WSS to the gateway's WebSocket port (8080) - Fly's proxy
# terminates TLS (via the "tls" handler below) and forwards plain HTTP/WS traffic to
# the container. Raw JBoss Remoting (17171) is NOT exposed here at all - only the
# gateway process inside the container talks to it, over 127.0.0.1.
#
# [[services]] + tcp_checks, not [http_service]: an http_service health check here
# got a flat "connection refused" from Fly's own checker despite the process being
# confirmed listening and answering real HTTP requests on 127.0.0.1:8080 (verified via
# `fly ssh console` + curl) - some http_service-specific check-routing issue. This is
# the same [[services]]/tcp_checks pattern that already proved out working earlier
# (transitioned cleanly to "passing" when checking port 17171), just pointed at 8080
# with TLS handlers added for wss://.
[[services]]
  protocol = 'tcp'
  internal_port = 8080

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [[services.ports]]
    port = 80
    handlers = ['http']
    force_https = true

  [[services.tcp_checks]]
    interval = '15s'
    timeout = '10s'
    grace_period = '30s'

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048

# Account/deck data (see mage.web.gateway.storage.AccountStore) - plain files, not a
# database. Fly volumes are pinned to a single machine, which is exactly why this app
# is scaled to 1 machine now (see `fly scale count 1`) - a second machine wouldn't see
# this volume's data at all.
[mounts]
  source = 'xeffigy_data'
  destination = '/data'
